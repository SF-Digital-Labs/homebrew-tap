# Keeps Formula/aoraki.rb pinned to the latest aoraki-cli release.
#
# Zero-credential design: aoraki-cli's release workflow can't push here with
# its own GITHUB_TOKEN (repo-scoped), so instead THIS repo polls the public
# releases API and rewrites its own formula — the default token can push to
# its own repo. Runs daily and on demand (kick it manually after a release
# for an instant bump).
name: sync-formula
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate formula from latest release
        run: |
          set -eu
          REPO="SF-Digital-Labs/aoraki-cli"
          TAG=$(curl -fsSL "https://api.github.com/repos/$REPO/releases/latest" | jq -r .tag_name)
          VERSION="${TAG#v}"
          base="https://github.com/$REPO/releases/download/$TAG"
          sha() { curl -fsSL "$base/aoraki-$1.tar.gz.sha256" | awk '{print $1}'; }
          ARM_MAC=$(sha aarch64-apple-darwin)
          X86_MAC=$(sha x86_64-apple-darwin)
          X86_LINUX=$(sha x86_64-unknown-linux-gnu)
          cat > Formula/aoraki.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # Binary formula for the Aoraki CLI. Kept in sync with the latest GitHub
          # release of SF-Digital-Labs/aoraki-cli by .github/workflows/sync.yml.
          class Aoraki < Formula
            desc "Ship code to the Aoraki cloud from your terminal, by hand or by agent"
            homepage "https://sf-digital-labs.github.io/aoraki-cli/"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "$base/aoraki-aarch64-apple-darwin.tar.gz"
                sha256 "$ARM_MAC"
              else
                url "$base/aoraki-x86_64-apple-darwin.tar.gz"
                sha256 "$X86_MAC"
              end
            end

            on_linux do
              url "$base/aoraki-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "$X86_LINUX"
            end

            def install
              bin.install "aoraki"
            end

            test do
              assert_match "aoraki", shell_output("#{bin}/aoraki --version")
            end
          end
          EOF
      - name: Commit if changed
        run: |
          git config user.name "aoraki-tap-bot"
          git config user.email "actions@github.com"
          git add Formula/aoraki.rb
          git diff --cached --quiet || git commit -m "formula: sync to latest aoraki-cli release" && git push
